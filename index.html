<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="main-card">
            <img id="hero-gif" src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" alt="teddy-hugging-gif">
            <div id="question" class="poem">
                <p>Babe, You have the eyes I want to lose my way,</p>
                <p>You have the arms where I would love to stay.</p>
                <p>You have the smile I never can resist,</p>
                <p>You have the voice I'd listen to all day.</p>
                <p>Out of this world, and all that I can view,</p>
                <p>My heart belongs to only you, just you.</p>
                <p class="closing">Soman, I love you!!!</p>
            </div>
        </div>
    </div>
</body>
</html>
